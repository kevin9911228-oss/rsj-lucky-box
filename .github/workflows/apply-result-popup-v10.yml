name: Apply result popup V10 polish

on:
  push:
    branches: [main]
    paths:
      - 'assets/result-popup-v10.css'
      - 'scripts/apply_result_popup_v10.py'
      - '.github/workflows/apply-result-popup-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire V10 result popup polish
        run: python scripts/apply_result_popup_v10.py
      - name: Validate V10 wiring
        run: |
          test -s assets/result-popup-v10.css
          grep -q "result-popup-v10.css?v=20260809-v10" index.html
          grep -q "animation:none!important" assets/result-popup-v10.css
      - name: Commit live V10 wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No wiring changes needed.'
            exit 0
          fi
          git commit -m 'Apply seamless result info overlay V10'
          git push
