name: Apply chest V20

on:
  push:
    branches: [main]
    paths:
      - 'assets/chest-v18.css'
      - 'scripts/build_chest_v18.py'
      - '.github/workflows/apply-chest-v18.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build ghost-free animation and rewire page
        run: python scripts/build_chest_v18.py
      - name: Validate V20
        run: |
          test -s assets/chest-open-anim-a.webp
          grep -q 'chest-v18.css?v=20260809-v20' index.html
          grep -q 'id="chestVisual"' index.html
          grep -q 'chest-open-anim-a.webp?v=20260809-v20' index.html
          grep -q 'chest-user-open-v13.webp?v=20260809-v20' index.html
          grep -q '宝箱正在缓缓开启' index.html
          grep -q '箱盖正在打开' index.html
      - name: Commit generated animation
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/chest-open-anim-a.webp
          if git diff --cached --quiet; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git commit -m 'Apply ghost-free single-chest opening V20'
          git push
