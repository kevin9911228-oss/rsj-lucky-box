name: Install Lucky Admin Delete V1
on:
  push:
    paths:
      - 'assets/lucky-admin-delete-v1.js'
      - '.github/workflows/install-lucky-admin-delete-v1.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach lucky admin delete UI
        run: |
          set -e
          git config user.name 'rsj-lucky-delete-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          lines=[ln for ln in s.splitlines() if 'lucky-admin-delete-v1.js' not in ln]
          s='\n'.join(lines)
          tag='<script src="/assets/lucky-admin-delete-v1.js?v=20260821-v1"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s+'\n',encoding='utf-8')
          PY
            if git diff --quiet -- admin.html; then exit 0; fi
            git add admin.html
            git commit -m 'Load lucky code delete control'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
