name: Apply result popup V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_result_card_popup_v2.py'
      - '.github/workflows/apply-result-card-popup-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply responsive luxury result popup V2
        run: python scripts/apply_result_card_popup_v2.py
      - name: Validate popup V2
        run: |
          grep -q 'RESULT_CARD_POPUP_V2' index.html
          grep -q 'overflow:hidden!important' index.html
          grep -q 'aspect-ratio:3/4!important' index.html
          grep -q 'object-fit:contain!important' index.html
      - name: Commit live popup V2
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No live changes needed.'
            exit 0
          fi
          git commit -m 'Polish winning card popup proportions and effects V2'
          git push
