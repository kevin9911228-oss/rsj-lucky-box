name: Install celebration V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-celebration-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh V2 celebration assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/assets/celebration-v2.css?v=20260809-v2','/assets/celebration-v2.css?v=20260809-v3')
          s=s.replace('/assets/celebration-v2.js?v=20260809-v2','/assets/celebration-v2.js?v=20260809-v3')
          hot='<link rel="stylesheet" href="/assets/celebration-v2-hotfix.css?v=20260809-v3">'
          if hot not in s:
              if '</head>' not in s:
                  raise SystemExit('index.html missing </head>')
              s=s.replace('</head>', hot+'\n</head>', 1)
          p.write_text(s,encoding='utf-8')
          print('celebration V2 vector hotfix installed')
          PY
      - name: Validate installation
        run: |
          grep -q 'celebration-v2.css?v=20260809-v3' index.html
          grep -q 'celebration-v2-hotfix.css?v=20260809-v3' index.html
          grep -q 'celebration-v2.js?v=20260809-v3' index.html
      - name: Commit updated page
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix celebration vector rendering and cache'
          git push
