name: Patch Admin Core V3
on:
  push:
    paths:
      - '.github/workflows/patch-admin-core-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin core loading and RPC resilience
        run: |
          set -e
          git config user.name 'rsj-admin-core-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          import re

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          rpc_new=r'''const ADMIN_READ_RPCS=new Set(['manager_login','manager_dashboard_summary','manager_members','manager_draws','manager_draws_by_date','manager_lucky_codes','manager_credit_logs','manager_gift_codes','manager_gift_draw_records','manager_security_snapshot','manager_security_risk_accounts','manager_security_audit','manager_social_dashboard','manager_social_members']);const ADMIN_RPC_INFLIGHT=new Map();function adminWait(ms){return new Promise(r=>setTimeout(r,ms))}function setAdminHealth(ok,msg){let el=document.getElementById('adminNetStateV3');if(!el){const top=document.querySelector('.topActions');if(top){el=document.createElement('span');el.id='adminNetStateV3';el.style.cssText='display:inline-flex;align-items:center;min-height:40px;padding:0 11px;border-radius:11px;border:1px solid #345247;background:#10151b;color:#84e0bc;font-size:11px;font-weight:800;white-space:nowrap';top.prepend(el)}}if(el){el.textContent='● '+(msg||(ok?'数据连接正常':'数据连接异常'));el.style.color=ok?'#84e0bc':'#ef9b8f';el.style.borderColor=ok?'#345247':'#6b3e3a'}}function adminErr(t,status){try{const j=JSON.parse(t||'{}');if(j.message||j.error||j.hint||j.details)return String(j.message||j.error||j.hint||j.details)}catch{}if(status===429)return'请求过于频繁，请稍后重试';if(status===408)return'数据请求超时';if(status>=500)return'数据服务暂时繁忙';return t&&t.length<180?t:'数据请求失败'}async function rpc(name,body){const read=ADMIN_READ_RPCS.has(name),key=name+'|'+JSON.stringify(body||{});if(read&&ADMIN_RPC_INFLIGHT.has(key))return ADMIN_RPC_INFLIGHT.get(key);const task=(async()=>{let last='网络波动';const max=read?3:1;for(let i=1;i<=max;i++){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body),signal:ctl.signal}),t=await r.text();clearTimeout(timer);if(r.ok){setAdminHealth(true,'数据连接正常');try{return JSON.parse(t)}catch{return{ok:false,message:'服务器返回格式异常'}}}last=adminErr(t,r.status);if(!read||!(r.status===408||r.status===429||r.status>=500)||i===max){setAdminHealth(false,last);return{ok:false,message:last,status:r.status}}}catch(e){clearTimeout(timer);last=e&&e.name==='AbortError'?'数据请求超时':'网络波动';if(i===max){setAdminHealth(false,last);return{ok:false,message:last+'，已自动重试'}}}await adminWait(400*i)}return{ok:false,message:last}})();if(read)ADMIN_RPC_INFLIGHT.set(key,task);try{return await task}finally{if(read)ADMIN_RPC_INFLIGHT.delete(key)}}function creds()'''

          s,n1=re.subn(r"async function rpc\(name,body\)\{.*?\}function creds\(\)",rpc_new,s,count=1,flags=re.S)
          if n1!=1:
              raise SystemExit(f'rpc patch count={n1}')

          load_new="async function loadAll(){await loadDashboard()}async function loadDashboard(){const d=await rpc('manager_dashboard_summary',creds());if(!d.ok)return authFail(d);$('stMembers').textContent=n(d.member_count);$('stCredits').textContent=n(d.total_credits);$('stDraws').textContent=n(d.draw_count);$('stRewards').textContent='¥'+n(d.reward_total);setAdminHealth(true,'数据连接正常')}function renderDashboard"
          s,n2=re.subn(r"async function loadAll\(\)\{.*?\}async function loadDashboard\(\)\{.*?\}function renderDashboard",load_new,s,count=1,flags=re.S)
          if n2!=1:
              raise SystemExit(f'load patch count={n2}')

          auth_new="function authFail(d){const msg=String(d&&d.message||'操作失败');if(msg.includes('验证失败')||msg.includes('登录已失效')){alert('管理员登录已失效，请重新登录');logout()}else{setAdminHealth(false,msg);console.warn('[admin module error]',msg,d||'')}}function showModal"
          s,n3=re.subn(r"function authFail\(d\)\{.*?\}function showModal",auth_new,s,count=1,flags=re.S)
          if n3!=1:
              raise SystemExit(f'authFail patch count={n3}')

          # Remove the temporary overlay version; core logic is now patched in-place.
          s='\n'.join(ln for ln in s.splitlines() if 'admin-stability-v2.js' not in ln)+'\n'
          p.write_text(s,encoding='utf-8')
          PY
            if git diff --quiet -- admin.html; then exit 0; fi
            git add admin.html
            git commit -m 'Stabilize admin core requests and lazy dashboard'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
