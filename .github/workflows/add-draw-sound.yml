name: Add immersive draw sounds

on:
  push:
    paths:
      - '.github/workflows/add-draw-sound.yml'

permissions:
  contents: write

jobs:
  add-sounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile-safe Web Audio effects
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          def one(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected section: {label}')
              s=s.replace(old,new,1)

          one('.credits b{font-size:18px;color:#ffd45b}.logout{flex:0 0 auto;padding:8px 11px;border-radius:10px;border:1px solid #604b29;background:#151a22;color:#decda9;font-weight:800}',
              '.credits b{font-size:18px;color:#ffd45b}.userActions{display:flex;align-items:center;gap:6px;flex:0 0 auto}.soundToggle,.logout{padding:8px 10px;border-radius:10px;border:1px solid #604b29;background:#151a22;color:#decda9;font-weight:800}.soundToggle{width:38px;padding-left:0;padding-right:0;font-size:16px}.logout{padding-left:11px;padding-right:11px}', 'sound button css')

          one('<button class="logout" onclick="logoutMember()">退出</button></div>',
              '<div class="userActions"><button id="soundBtn" class="soundToggle" onclick="toggleSound()" aria-label="音效开关">🔊</button><button class="logout" onclick="logoutMember()">退出</button></div></div>', 'sound button html')

          one("let session=null,drawing=false,currentTab='normal',lastCardIndex=-1;",
              "let session=null,drawing=false,currentTab='normal',lastCardIndex=-1;let audioCtx=null,masterGain=null,soundEnabled=localStorage.getItem('rsj_sound')!=='off';", 'audio state')

          audio = r'''function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function initAudio(){if(!soundEnabled)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx){audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=.7;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function updateSoundButton(){if(typeof soundBtn!=='undefined'){soundBtn.textContent=soundEnabled?'🔊':'🔇';soundBtn.title=soundEnabled?'关闭音效':'开启音效'}}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('rsj_sound',soundEnabled?'on':'off');updateSoundButton();if(soundEnabled){initAudio();tone(660,.06,.028,'triangle');tone(880,.09,.024,'sine',.055)}}
function tone(freq,dur=.05,vol=.025,type='sine',delay=0,slideTo=0){const ctx=initAudio();if(!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,freq),t);if(slideTo>0)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.03)}
function noiseBurst(dur=.24,vol=.04,delay=0){const ctx=initAudio();if(!ctx)return;const len=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter(),t=ctx.currentTime+delay;f.type='lowpass';f.frequency.value=1800;src.buffer=buf;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f);f.connect(g);g.connect(masterGain);src.start(t)}
function playStartSound(){tone(196,.11,.026,'sine');tone(294,.12,.024,'triangle',.08);tone(392,.12,.02,'triangle',.16)}
function playCardTick(index,phase='fast',locked=false){if(!soundEnabled)return;const notes=[392,440,494,523,587,659,698,784],base=notes[index%notes.length];if(locked){tone(base,.13,.05,'triangle');tone(base*1.5,.22,.032,'sine',.07);tone(base*2,.25,.022,'sine',.15);return}if(phase==='fast')tone(base,.026,.014,'triangle');else if(phase==='mid')tone(base+35,.045,.02,'triangle');else tone(base+70,.08,.026,'triangle')}
function playExplosionSound(reward){noiseBurst(.32,.05);tone(135,.34,.055,'sine',0,48);tone(620,.13,.025,'triangle',.07);tone(930,.2,.026,'sine',.14);if(+reward===888){tone(523,.18,.04,'triangle',.28);tone(659,.2,.04,'triangle',.43);tone(784,.24,.045,'triangle',.58);tone(1047,.45,.045,'sine',.76)}}
function playResultChime(reward){if(+reward===888)return;tone(+reward>=200?784:659,.12,.025,'triangle');tone(+reward>=200?1047:880,.22,.022,'sine',.1)}
document.addEventListener('DOMContentLoaded',updateSoundButton);'''
          one('function wait(ms){return new Promise(r=>setTimeout(r,ms))}', audio, 'audio functions')

          one("function lightCard(index,locked=false){const cards=[...document.querySelectorAll('.prize')];cards.forEach(x=>x.classList.remove('active','locked'));const card=cards[index%cards.length];card.classList.add(locked?'locked':'active');lastCardIndex=index%cards.length;return card}",
              "function lightCard(index,locked=false,phase='fast'){const cards=[...document.querySelectorAll('.prize')];cards.forEach(x=>x.classList.remove('active','locked'));const card=cards[index%cards.length];card.classList.add(locked?'locked':'active');lastCardIndex=index%cards.length;playCardTick(lastCardIndex,phase,locked);return card}", 'card tick hook')

          one("for(const d of fastDelays){lightCard(idx);idx=(idx+1)%cards.length;await wait(d)}", "for(const d of fastDelays){lightCard(idx,false,'fast');idx=(idx+1)%cards.length;await wait(d)}", 'fast sounds')
          one("for(const d of midDelays){lightCard(idx);idx=(idx+1)%cards.length;await wait(d)}", "for(const d of midDelays){lightCard(idx,false,'mid');idx=(idx+1)%cards.length;await wait(d)}", 'mid sounds')
          one('lightCard(idx,isFinal);', "lightCard(idx,isFinal,'slow');", 'slow sounds')
          one("stage.classList.remove('opening');stage.classList.add('explode');flash();", "stage.classList.remove('opening');stage.classList.add('explode');flash();playExplosionSound(reward);", 'explosion sound')
          one("resultModal.classList.add('show');document.body.style.overflow='hidden';", "resultModal.classList.add('show');document.body.style.overflow='hidden';playResultChime(reward);", 'result chime')
          one("if(!session||drawing||session.credits<=0)return;\n  drawing=true;", "if(!session||drawing||session.credits<=0)return;\n  initAudio();playStartSound();\n  drawing=true;", 'start sound')
          one("for(let i=0;i<10;i++){lightCard(idx);idx=(idx+1)%cards.length;await wait(62+i*3)}", "for(let i=0;i<10;i++){lightCard(idx,false,'fast');idx=(idx+1)%cards.length;await wait(62+i*3)}", 'opening card sound')
          one("const luck=luckyCode.value.trim();if(!luck)return alert('请输入幸运码');", "const luck=luckyCode.value.trim();if(!luck)return alert('请输入幸运码');initAudio();playStartSound();", 'lucky code sound')

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script block not found');
          new Function(m[1]);
          console.log('JS syntax OK');
          NODE
      - name: Commit audio update
        run: |
          git config user.name "rsj-lucky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add immersive draw sound effects"
          git push
