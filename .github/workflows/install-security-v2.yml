name: Install Security V2
on:
  push:
    paths:
      - 'assets/security-admin-v2.js'
      - '.github/workflows/install-security-v2.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach Security V2
        run: |
          set -e
          git config user.name 'rsj-security-v2-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/security-admin-v2.js?v=20260815-v2"></script>'
          lines=[ln for ln in s.splitlines() if 'security-admin-v2.js' not in ln]
          s='\n'.join(lines)
          if '</body>' in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s+'\n',encoding='utf-8')
          PY
            if git diff --quiet -- admin.html; then
              echo 'Security V2 already installed.'
              exit 0
            fi
            git add admin.html
            git commit -m 'Separate security review and manual restriction archive'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Failed to install Security V2 after retries.' >&2
          exit 1
