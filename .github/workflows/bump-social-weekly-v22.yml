name: Bump Social Weekly V2.2 Cache
on:
  push:
    paths:
      - '.github/workflows/bump-social-weekly-v22.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump social weekly script cache
        run: |
          sed -i 's#social-weekly-v2.js?v=20260810-v2-1#social-weekly-v2.js?v=20260810-v2-2#g' index.html
      - name: Commit cache bump
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load sequential social energy V2.2'
          git push
