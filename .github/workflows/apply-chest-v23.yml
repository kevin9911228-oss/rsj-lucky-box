name: Apply chest V23

on:
  push:
    branches: [main]
    paths:
      - 'assets/effect-keyframes-v23.b64'
      - 'assets/chest-v23.css'
      - 'assets/chest-v23.js'
      - 'scripts/build_chest_v23.py'
      - '.github/workflows/apply-chest-v23.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build approved effect-art chest animation and wire page
        run: python scripts/build_chest_v23.py
      - name: Validate V23
        run: |
          test -s assets/chest-effect-closed-v23.webp
          test -s assets/chest-effect-opening-v23.webp
          test -s assets/chest-effect-open-v23.webp
          grep -q 'chest-v23.css?v=20260809-v23' index.html
          grep -q 'chest-v23.js?v=20260809-v23' index.html
          grep -q 'chest-effect-opening-v23.webp?v=20260809-v23' index.html
      - name: Commit generated V23 assets and live wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/effect-keyframes-v23.jpg assets/chest-effect-closed-v23.webp assets/chest-effect-opening-v23.webp assets/chest-effect-open-v23.webp
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply approved effect-art chest opening V23'
          git push
