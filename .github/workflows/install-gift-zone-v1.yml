name: Install Gift Zone V1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-gift-zone-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load gift zone assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/assets/gift-zone-v1.css?v=20260810-v1">'
          js='<script src="/assets/gift-zone-v1.js?v=20260810-v1"></script>'
          if 'gift-zone-v1.css' not in s:
              s=s.replace('</head>', css+'\n</head>')
          if 'gift-zone-v1.js' not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site integration
        shell: bash
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load royal gift wheel zone V1'
          git push origin main
