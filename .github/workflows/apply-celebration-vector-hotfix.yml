name: Apply celebration vector hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-celebration-vector-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch celebration asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/assets/celebration-v2.css?v=20260809-v2','/assets/celebration-v2.css?v=20260809-v3')
          s=s.replace('/assets/celebration-v2.js?v=20260809-v2','/assets/celebration-v2.js?v=20260809-v3')
          hot='<link rel="stylesheet" href="/assets/celebration-v2-hotfix.css?v=20260809-v3">'
          if hot not in s:
              s=s.replace('</head>', hot+'\n</head>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'celebration-v2.css?v=20260809-v3' index.html
          grep -q 'celebration-v2-hotfix.css?v=20260809-v3' index.html
          grep -q 'celebration-v2.js?v=20260809-v3' index.html
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply celebration vector hotfix'
          git push
