name: Apply result popup V11.4
on:
  push:
    paths:
      - 'assets/result-popup-v11-4.css'
      - '.github/workflows/apply-result-popup-v11-4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load V11.4 after V11
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); a='<link rel=\"stylesheet\" href=\"/assets/result-popup-v11.css?v=20260810-v11\">'; b='<link rel=\"stylesheet\" href=\"/assets/result-popup-v11-4.css?v=20260810-v11-4\">'; p.write_text(s if b in s else s.replace(a,a+'\\n'+b))"
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-result-popup-v11-4.yml
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/apply-result-popup-v11-4.yml
          git commit -m 'Load seamless rear curtain and accent-only spreading FX V11.4'
          git push
