name: Apply result popup V3

on:
  push:
    branches: [main]
    paths:
      - 'assets/result-close-v3.svg'
      - 'assets/result-frame-v3.svg'
      - 'assets/result-button-gold-v3.svg'
      - 'assets/result-button-dark-v3.svg'
      - 'assets/result-popup-v3.css'
      - 'scripts/apply_result_popup_v3.py'
      - '.github/workflows/apply-result-popup-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ornate result popup V3
        run: python scripts/apply_result_popup_v3.py
      - name: Validate popup V3
        run: |
          grep -q 'result-popup-v3.css?v=20260809-v3' index.html
          test -s assets/result-close-v3.svg
          test -s assets/result-frame-v3.svg
          test -s assets/result-button-gold-v3.svg
          test -s assets/result-button-dark-v3.svg
      - name: Commit live popup V3
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git commit -m 'Apply ornate result popup chrome V3'
          git push
