name: Install Admin Batch And Gift Records
on:
  push:
    paths:
      - 'assets/security-admin-v3.js'
      - 'assets/gift-admin-v4.js'
      - '.github/workflows/install-admin-batch-gift-records.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach admin tools
        run: |
          set -e
          git config user.name 'rsj-admin-tools-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="/assets/security-admin-v3.js?v=20260817-v3"></script>',
            '<script src="/assets/gift-admin-v4.js?v=20260817-v4"></script>'
          ]
          lines=[ln for ln in s.splitlines() if 'security-admin-v3.js' not in ln and 'gift-admin-v4.js' not in ln]
          s='\n'.join(lines)
          if '</body>' in s:
            s=s.replace('</body>','\n'.join(tags)+'\n</body>',1)
          p.write_text(s+'\n',encoding='utf-8')
          PY
            if git diff --quiet -- admin.html; then
              echo 'Admin tools already installed.'
              exit 0
            fi
            git add admin.html
            git commit -m 'Add batch security actions and gift winning records'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to install admin tools after retries.' >&2
          exit 1
