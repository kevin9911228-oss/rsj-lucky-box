name: Test Security Gateway
on:
  push:
    paths:
      - '.github/workflows/test-security-gateway.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe gateway IP capture
        run: |
          set -e
          curl -fsS 'https://iovzxyzjekaikvnkrenz.supabase.co/functions/v1/security-gateway'
      - name: Probe routed registration without creating account
        run: |
          set -e
          curl -fsS -X POST 'https://iovzxyzjekaikvnkrenz.supabase.co/functions/v1/security-gateway' \
            -H 'Content-Type: application/json' \
            --data '{"rpc":"self_register_member","args":{"p_member_code":"x","p_display_name":"security-probe","p_pin":"123456"},"device_id":"security-probe-device","fingerprint":"security-probe-fp"}'
