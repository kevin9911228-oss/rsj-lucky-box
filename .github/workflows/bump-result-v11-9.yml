name: Bump result V11.9 cache

on:
  push:
    paths:
      - '.github/workflows/bump-result-v11-9.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump result popup cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'result-popup-v11-4.css?v=20260810-v11-8'
          new = 'result-popup-v11-4.css?v=20260810-v11-9'
          if old not in s:
              raise SystemExit(f'cache key not found: {old}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache bump
        run: |
          git config user.name "rsj-lucky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Load result popup V11.9 with transparent FX backing"
          git push
