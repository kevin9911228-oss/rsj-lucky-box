name: Enable persistent member login

on:
  push:
    paths:
      - '.github/workflows/enable-persistent-login.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch frontend to persistent session tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('missing '+label)
              s=s.replace(old,new,1)

          rep("const $=id=>document.getElementById(id);let session=null,drawing=false,lastCardIndex=-1,loginReturn='home';let audioCtx=null,masterGain=null,soundEnabled=localStorage.getItem('rsj_sound')!=='off';",
              "const $=id=>document.getElementById(id);const SESSION_KEY='rsj_member_session';let session=null,drawing=false,lastCardIndex=-1,loginReturn='home';let audioCtx=null,masterGain=null,soundEnabled=localStorage.getItem('rsj_sound')!=='off';",
              'session key')

          old_login="async function loginMember(){const code=$('memberCode').value.trim(),pin=$('memberPin').value;if(!code||!pin)return showLoginMsg('请输入全球联动账号和抽奖密码');$('loginBtn').disabled=true;$('loginBtn').textContent='正在登录…';const d=await rpc('member_status',{p_member_code:code,p_pin:pin});$('loginBtn').disabled=false;$('loginBtn').textContent='登录';if(!d.ok)return showLoginMsg(d.message||'账号或密码不正确');session={code,pin,name:d.display_name,credits:+d.draw_credits||0};$('memberPin').value='';closeLoginModal();renderSession();if(loginReturn==='lucky')switchTab('lucky');else if(loginReturn==='my')switchTab('my');else switchTab('home')}"
          new_login="async function loginMember(){const code=$('memberCode').value.trim(),pin=$('memberPin').value;if(!code||!pin)return showLoginMsg('请输入全球联动账号和抽奖密码');$('loginBtn').disabled=true;$('loginBtn').textContent='正在登录…';const d=await rpc('member_login_session',{p_member_code:code,p_pin:pin});$('loginBtn').disabled=false;$('loginBtn').textContent='登录';if(!d.ok)return showLoginMsg(d.message||'账号或密码不正确');session={token:d.token,code:d.member_code||code,name:d.display_name,credits:+d.draw_credits||0};localStorage.setItem(SESSION_KEY,d.token);$('memberPin').value='';closeLoginModal();renderSession();if(loginReturn==='lucky')switchTab('lucky');else if(loginReturn==='my')switchTab('my');else switchTab('home')}"
          rep(old_login,new_login,'loginMember')

          marker="function showLoginMsg(t){$('loginMsg').textContent=t;$('loginMsg').classList.remove('hide')}"
          restore="function showLoginMsg(t){$('loginMsg').textContent=t;$('loginMsg').classList.remove('hide')}\nasync function restoreSession(){const token=localStorage.getItem(SESSION_KEY);if(!token)return;const d=await rpc('member_session_status',{p_token:token});if(!d.ok){localStorage.removeItem(SESSION_KEY);return}session={token,code:d.member_code,name:d.display_name,credits:+d.draw_credits||0};renderSession()}"
          rep(marker,restore,'restoreSession')

          old_logout="function logoutMember(){closeResult();closeHistoryModal();session=null;drawing=false;clearCards();$('memberPin').value='';$('luckyCode').value='';$('historyList').innerHTML='<div class=\"empty\">登录后可查看自己的抽奖记录</div>';$('summaryReward').textContent='0';$('summaryCount').textContent='0';renderSession();switchTab('home')}"
          new_logout="async function logoutMember(){const token=session&&session.token;localStorage.removeItem(SESSION_KEY);closeResult();closeHistoryModal();session=null;drawing=false;clearCards();$('memberPin').value='';$('luckyCode').value='';$('historyList').innerHTML='<div class=\"empty\">登录后可查看自己的抽奖记录</div>';$('summaryReward').textContent='0';$('summaryCount').textContent='0';renderSession();switchTab('home');if(token)await rpc('member_session_logout',{p_token:token})}"
          rep(old_logout,new_logout,'logoutMember')

          s=s.replace("rpc('update_member_display_name',{p_member_code:session.code,p_pin:session.pin,p_display_name:name})","rpc('member_session_update_display_name',{p_token:session.token,p_display_name:name})")
          s=s.replace("rpc('member_draw_summary',{p_member_code:session.code,p_pin:session.pin})","rpc('member_session_draw_summary',{p_token:session.token})")
          s=s.replace("rpc('member_draw_history',{p_member_code:session.code,p_pin:session.pin,p_limit:50})","rpc('member_session_draw_history',{p_token:session.token,p_limit:50})")
          s=s.replace("rpc('draw_blind_box',{p_member_code:session.code,p_pin:session.pin})","rpc('member_session_draw',{p_token:session.token})")
          s=s.replace("rpc('member_temporary_lucky_draw',{p_member_code:session.code,p_pin:session.pin,p_lucky_code:luck})","rpc('member_session_temporary_lucky_draw',{p_token:session.token,p_lucky_code:luck})")

          rep('renderSession();\n</script>','renderSession();restoreSession();\n</script>','startup restore')

          required=[
            "member_login_session","member_session_status","member_session_logout",
            "member_session_draw","member_session_temporary_lucky_draw",
            "member_session_draw_history","member_session_draw_summary",
            "member_session_update_display_name","SESSION_KEY","restoreSession()"
          ]
          for x in required:
              if x not in s: raise SystemExit('missing required marker '+x)
          if 'session.pin' in s: raise SystemExit('old session.pin reference remains')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script block missing');
          new Function(m[1]);
          if(!s.includes("localStorage.setItem(SESSION_KEY,d.token)")) throw new Error('token storage missing');
          if(!s.includes('restoreSession();')) throw new Error('auto restore missing');
          console.log('Persistent login frontend validation OK');
          NODE
      - name: Commit frontend session change
        run: |
          git config user.name "rsj-lucky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Keep members signed in across refreshes"
          git push
