name: Install Social Weekly V2
on:
  push:
    branches: [main]
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize weekly social UI assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="/assets/social-weekly-v2\.js\?v=[^"]+"></script>', '', s)
          s=s.replace('</body>','\n<script src="/assets/social-weekly-v2.js?v=20260810-v2-2"></script>\n</body>')
          p.write_text(s)

          p=Path('admin.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="/assets/social-admin-weekly-v2\.js\?v=[^"]+"></script>', '', s)
          s=s.replace('</body>','\n<script src="/assets/social-admin-weekly-v2.js?v=20260810-v2"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name rsj-lucky-bot
          git config user.email actions@users.noreply.github.com
          git add index.html admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize social weekly asset loading"
          git push
