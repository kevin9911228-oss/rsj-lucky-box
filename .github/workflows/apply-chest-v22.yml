name: Apply chest V22

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_chest_v22.py'
      - 'assets/chest-v22.css'
      - 'assets/chest-v22.js'
      - '.github/workflows/apply-chest-v22.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build complete-frame Animated WebP and wire page
        run: python scripts/build_chest_v22.py
      - name: Validate V22
        run: |
          test -s assets/chest-opening-v22.webp
          grep -q 'chest-v22.css?v=20260809-v22' index.html
          grep -q 'chest-v22.js?v=20260809-v22' index.html
          grep -q 'chest-opening-v22.webp?v=20260809-v22' index.html
          grep -q 'complete Animated WebP' assets/chest-v22.js
      - name: Commit generated animation and live wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/chest-opening-v22.webp
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply seamless complete-frame chest opening V22'
          git push
