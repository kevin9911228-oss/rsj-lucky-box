name: Run draw safety upgrade
on:
  push:
    paths:
      - '.github/workflows/run-upgrade-draw-safety.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python scripts/upgrade_draw_safety.py
      - name: Validate
        run: |
          node - <<'NODE'
          const s=require('fs').readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          new Function(m[1]);
          for(const x of ['member_session_draw_safe','recoverPendingDraw','rewardTier','showNotice']) if(!s.includes(x)) throw Error(x);
          if(/\balert\s*\(/.test(s)) throw Error('native alert remains');
          NODE
      - name: Commit
        run: |
          git config user.name rsj-lucky-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m 'Add idempotent draw recovery and styled history'
          git push