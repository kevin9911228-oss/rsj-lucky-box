name: Install Result V12
on:
  push:
    paths:
      - 'assets/result-popup-v12.css'
      - 'assets/result-lucky-v12.js'
      - '.github/workflows/install-result-v12.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach result V12
        run: |
          set -e
          git config user.name 'rsj-result-v12-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/assets/result-popup-v12.css?v=20260815-v12-2">'
          js='<script src="/assets/result-lucky-v12.js?v=20260815-v12-2"></script>'
          lines=[ln for ln in s.splitlines() if 'result-popup-v12.css' not in ln and 'result-lucky-v12.js' not in ln]
          s='\n'.join(lines)
          if '</head>' in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if '</body>' in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s+'\n',encoding='utf-8')
          PY
            if git diff --quiet -- index.html; then
              echo 'Result V12 already installed.'
              exit 0
            fi
            git add index.html
            git commit -m 'Restore lucky code UI and hide public code value'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to install Result V12 after retries.' >&2
          exit 1
