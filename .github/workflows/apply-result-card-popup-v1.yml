name: Apply winning card popup V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_result_card_popup_v1.py'
      - '.github/workflows/apply-result-card-popup-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply winning card popup
        run: python scripts/apply_result_card_popup_v1.py
      - name: Validate result popup
        run: |
          grep -q 'RESULT_CARD_POPUP_V1' index.html
          grep -q 'winPrizeVisual' index.html
          grep -q "'/assets/prizes/'+reward+'.png?v=final-hd-20260808'" index.html
      - name: Commit live result popup
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Use actual winning prize card in result popup'
          git push
