name: Switch Royal Chest To SVG V2

on:
  push:
    branches: [main]
    paths:
      - '.trigger-chest-svg-v2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest index and push
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/switch_chest_to_svg.py
            git add index.html
            if git diff --cached --quiet; then
              echo 'index already uses SVG chest'
              exit 0
            fi
            git commit -m 'Use valid SVG royal chest artwork'
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
