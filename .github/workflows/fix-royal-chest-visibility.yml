name: Fix Royal Chest Visibility

on:
  push:
    branches: [main]
    paths:
      - '.fix-royal-chest-visibility-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore chest artwork in idle state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          patch = r'''
/* ROYAL_CHEST_VISIBILITY_HOTFIX */
.chest{
  background:url('/assets/royal-chest.webp?v=royal-visible-v4') center/contain no-repeat!important;
  overflow:visible!important;
}
.chest:before,.chest:after{
  opacity:0!important;
  visibility:hidden!important;
}
.stage.explode .chest{
  background:none!important;
}
.stage.explode .chest:before,.stage.explode .chest:after{
  opacity:1!important;
  visibility:visible!important;
}
.stage:not(.explode) .band{opacity:.16!important}
.stage:not(.explode) .lock{opacity:1!important}
@media(max-width:350px){.chest{background-size:contain!important}}
'''
          if '/* ROYAL_CHEST_VISIBILITY_HOTFIX */' not in s:
              s = s.replace('\n</style>', '\n' + patch + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix royal chest visibility'
          git push
