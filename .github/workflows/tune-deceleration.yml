name: Tune final card deceleration

on:
  push:
    paths:
      - '.github/workflows/tune-deceleration.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make final jumps progressively slower
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "const delay=300+Math.pow(p,1.8)*520;"
          new = "const delay=220+Math.pow(p,3.2)*850;"
          if old not in s:
              raise SystemExit('Expected timing expression not found')
          s = s.replace(old, new, 1)
          s = s.replace("stageText.innerHTML=s>slowCount-4?'最后几格…<small>一格一格揭晓</small>':'逐格减速中…<small>每一格都有可能</small>';", "stageText.innerHTML=s>slowCount-4?'最后几格…<small>越来越慢 · 马上锁定</small>':'逐格减速中…<small>速度正在持续下降</small>';", 1)
          s = s.replace("await wait(650);\n  return target;", "await wait(850);\n  return target;", 1)
          p.write_text(s)
          PY
      - name: Commit timing change
        run: |
          git config user.name "rsj-lucky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make final card jumps progressively slower"
          git push
