name: Apply result popup V9 polish

on:
  push:
    branches: [main]
    paths:
      - 'assets/result-popup-v9.css'
      - 'assets/result-wheat-v9.svg'
      - 'scripts/apply_result_popup_v9.py'
      - '.github/workflows/apply-result-popup-v9.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire V9 result popup polish
        run: python scripts/apply_result_popup_v9.py
      - name: Validate V9 wiring
        run: |
          test -s assets/result-popup-v9.css
          test -s assets/result-wheat-v9.svg
          grep -q "result-popup-v9.css" index.html
      - name: Commit live V9 wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git commit -m 'Apply result popup info cleanup V9'
          git push
