name: Apply result popup V8 polish

on:
  push:
    branches: [main]
    paths:
      - 'assets/result-popup-v8.css'
      - 'assets/result-wheat-v8.svg'
      - 'assets/result-divider-v8.svg'
      - 'scripts/apply_result_popup_v8.py'
      - '.github/workflows/apply-result-popup-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire V8 result popup polish
        run: python scripts/apply_result_popup_v8.py
      - name: Validate V8 wiring
        run: |
          test -s assets/result-popup-v8.css
          test -s assets/result-wheat-v8.svg
          test -s assets/result-divider-v8.svg
          grep -q 'result-popup-v8.css?v=20260809-v8' index.html
      - name: Commit live V8 wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No wiring changes needed.'
            exit 0
          fi
          git commit -m 'Apply result popup info polish V8'
          git push
