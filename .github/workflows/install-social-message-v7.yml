name: Install Social Message V7
on:
  push:
    branches: [main]
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load V7 minimal friend space
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script src="/assets/social-message-v7\.js\?v=[^"]+"></script>', '', s)
          s=s.replace('</body>','\n<script src="/assets/social-message-v7.js?v=20260810-v7-2"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name rsj-lucky-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load minimal friend space V7.2"
          git pull --rebase origin main
          git push origin HEAD:main
