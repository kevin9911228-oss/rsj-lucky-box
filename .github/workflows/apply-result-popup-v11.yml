name: Apply result popup V11 polish
on:
  push:
    paths:
      - '.github/workflows/apply-result-popup-v11.yml'
      - 'scripts/apply_result_popup_v11.py'
      - 'assets/result-popup-v11.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire V11 result popup polish
        run: python scripts/apply_result_popup_v11.py
      - name: Validate V11 wiring
        run: grep -q 'result-popup-v11.css?v=20260810-v11' index.html
      - name: Commit live V11 wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply sampled info panel V11'
          git push
