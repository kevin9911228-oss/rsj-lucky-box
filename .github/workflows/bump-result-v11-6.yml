name: Bump result V11.6 cache
on:
  push:
    paths:
      - '.github/workflows/bump-result-v11-6.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump result CSS cache key
        run: sed -i 's#result-popup-v11-4.css?v=20260810-v11-4#result-popup-v11-4.css?v=20260810-v11-6#g' index.html
      - name: Commit
        run: |
          rm .github/workflows/bump-result-v11-6.yml
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/bump-result-v11-6.yml
          git commit -m 'Load result popup V11.6 without black cover'
          git push
