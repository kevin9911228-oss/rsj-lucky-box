name: Upgrade premium prize cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-prize-cards.yml'
      - 'scripts/upgrade_prize_cards.py'
      - 'assets/prizes/**'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade prize card visuals
        run: python scripts/upgrade_prize_cards.py
      - name: Commit updated page
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade premium prize card visuals'
          git push
