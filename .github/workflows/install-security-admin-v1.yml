name: Install Security Admin V1
on:
  push:
    paths:
      - '.github/workflows/install-security-admin-v1.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install security admin
        shell: bash
        run: |
          set -e
          git config user.name 'rsj-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/security-admin-v1.js?v=20260811-v1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
            git add admin.html
            if git diff --cached --quiet; then echo 'Already installed'; exit 0; fi
            git commit -m 'Add IP and device security audit to admin'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push conflict, retry $n"
            sleep 2
          done
          exit 1
