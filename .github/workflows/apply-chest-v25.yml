name: Apply chest V25 ceremonial GIF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_chest_v25.py'
      - 'assets/chest-v25.css'
      - 'assets/chest-v25.js'
      - '.github/workflows/apply-chest-v25.yml'

permissions:
  contents: write

jobs:
  build-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install animation dependencies
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Build 7.98 second ceremonial GIF and wire live page
        run: python scripts/build_chest_v25.py
      - name: Validate V25 timing and wiring
        run: |
          test -s assets/chest-effect-closed-v25.webp
          test -s assets/chest-effect-opening-v25.gif
          test -s assets/chest-effect-open-v25.webp
          grep -q 'chest-v25.css?v=20260809-v25' index.html
          grep -q 'chest-v25.js?v=20260809-v25' index.html
          grep -q 'chest-effect-opening-v25.gif?v=20260809-v25' index.html
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/chest-effect-opening-v25.gif')
          assert im.n_frames == 133, im.n_frames
          total=0
          for i in range(im.n_frames):
              im.seek(i)
              total += int(im.info.get('duration',60))
          assert 7920 <= total <= 8040, total
          print('validated V25:', im.n_frames, 'frames,', total, 'ms')
          PY
      - name: Commit generated V25 assets and live wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/effect-keyframes-v25.jpg assets/chest-effect-closed-v25.webp assets/chest-effect-opening-v25.gif assets/chest-effect-open-v25.webp
          if git diff --cached --quiet; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git commit -m 'Apply 7.98s luxury ceremonial GIF chest V25'
          git push
