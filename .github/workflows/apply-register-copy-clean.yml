name: Apply Register Copy Clean

on:
  push:
    paths:
      - '.github/workflows/apply-register-copy-clean.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply register copy on latest main
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('全球联动账号（4-30位字母/数字）', '全球联动账号')
          for old in (
              'social-message-v7.js?v=20260811-v7-5',
              'social-message-v7.js?v=20260811-v7-6',
              'social-message-v7.js?v=20260811-v7-7',
          ):
              s = s.replace(old, 'social-message-v7.js?v=20260811-v7-8')
          p.write_text(s, encoding='utf-8')
          PY
            git add index.html
            if git diff --cached --quiet; then
              echo 'Register copy already clean'
              exit 0
            fi
            git commit -m 'Simplify self-register account hint'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying ($attempt/5)"
            sleep 3
          done
          echo 'Failed after retries'
          exit 1
