name: Rebuild chest V13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chest-v13.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Rebuild transparent aligned chest assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import base64, re, io

          src = Path('assets/chest-user-v10.css').read_text(encoding='utf-8')
          out = Path('assets')

          def extract(kind):
              prefix = '--rsj-user-chest-' + kind
              pos = src.find(prefix)
              if pos < 0:
                  raise SystemExit('missing ' + prefix)
              start = src.find('base64,', pos)
              if start < 0:
                  raise SystemExit('missing base64 for ' + kind)
              start += len('base64,')
              ends = [i for i in (src.find('"', start), src.find("'", start), src.find(')', start)) if i >= 0]
              if not ends:
                  raise SystemExit('cannot find end of ' + kind + ' data')
              end = min(ends)
              return Image.open(io.BytesIO(base64.b64decode(src[start:end]))).convert('RGBA')

          def remove_black(img):
              px = img.load()
              for y in range(img.height):
                  for x in range(img.width):
                      r,g,b,a = px[x,y]
                      hi = max(r,g,b)
                      if hi <= 24:
                          px[x,y] = (0,0,0,0)
                      elif hi < 52:
                          na = int(a * (hi-24) / 28)
                          px[x,y] = (r,g,b,max(0,min(255,na)))
              bbox = img.getbbox()
              return img.crop(bbox) if bbox else img

          def sharpen_resize(img, target_w):
              ratio = target_w / img.width
              img = img.resize((target_w, max(1, round(img.height*ratio))), Image.Resampling.LANCZOS)
              rgb = img.convert('RGB').filter(ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=2))
              return Image.merge('RGBA', (*rgb.split(), img.getchannel('A')))

          closed = sharpen_resize(remove_black(extract('closed')), 820)
          opened = sharpen_resize(remove_black(extract('open')), 760)
          CW, CH, BASELINE = 1040, 920, 835

          def place(img):
              canvas = Image.new('RGBA',(CW,CH),(0,0,0,0))
              x = (CW-img.width)//2
              y = BASELINE-img.height
              canvas.alpha_composite(img,(x,y))
              return canvas, (x,y,x+img.width,y+img.height)

          closed_canvas, cb = place(closed)
          open_canvas, _ = place(opened)
          seam = cb[1] + round((cb[3]-cb[1]) * 0.455)

          lid = Image.new('RGBA',(CW,CH),(0,0,0,0))
          body = Image.new('RGBA',(CW,CH),(0,0,0,0))
          lid.alpha_composite(closed_canvas.crop((0,0,CW,seam+8)),(0,0))
          body.alpha_composite(closed_canvas.crop((0,seam-10,CW,CH)),(0,seam-10))

          for name,img in [
              ('chest-user-closed-v13.webp',closed_canvas),
              ('chest-user-open-v13.webp',open_canvas),
              ('chest-user-lid-v13.webp',lid),
              ('chest-user-body-v13.webp',body),
          ]:
              img.save(out/name,'WEBP',quality=92,method=6)

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="/assets/chest-v13.css?v=20260809-v13">'
          if link not in html:
              html = html.replace('</head>', link+'\n</head>', 1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Validate V13
        run: |
          test -s assets/chest-user-closed-v13.webp
          test -s assets/chest-user-open-v13.webp
          test -s assets/chest-user-lid-v13.webp
          test -s assets/chest-user-body-v13.webp
          grep -q 'chest-v13.css?v=20260809-v13' index.html
          grep -q 'rsjRealLidOpenV13' assets/chest-v13.css
      - name: Commit live V13
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/chest-v13.css assets/chest-user-closed-v13.webp assets/chest-user-open-v13.webp assets/chest-user-lid-v13.webp assets/chest-user-body-v13.webp
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Rebuild chest with transparent aligned slow-opening V13'
          git push
