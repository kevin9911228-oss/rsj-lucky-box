name: Apply chest V24

on:
  push:
    branches: [main]
    paths:
      - 'assets/effect-keyframes-v23.part1'
      - 'assets/effect-keyframes-v23.part2'
      - 'assets/effect-keyframes-v23.part3'
      - 'assets/effect-keyframes-v23.part4'
      - 'assets/effect-keyframes-v23.part5a'
      - 'assets/effect-keyframes-v23.part5b'
      - 'assets/chest-v24.css'
      - 'assets/chest-v24.js'
      - 'scripts/build_chest_v24.py'
      - '.github/workflows/apply-chest-v24.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install animation dependencies
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Build smooth GIF and wire live page
        run: python scripts/build_chest_v24.py
      - name: Validate V24
        run: |
          test -s assets/chest-effect-closed-v24.webp
          test -s assets/chest-effect-opening-v24.gif
          test -s assets/chest-effect-open-v24.webp
          grep -q 'chest-v24.css?v=20260809-v24' index.html
          grep -q 'chest-v24.js?v=20260809-v24' index.html
          grep -q 'chest-effect-opening-v24.gif?v=20260809-v24' index.html
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/chest-effect-opening-v24.gif')
          assert getattr(im,'n_frames',1) >= 55, getattr(im,'n_frames',1)
          print('validated GIF frames:', im.n_frames)
          PY
      - name: Commit generated V24 assets and live wiring
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/effect-keyframes-v24.jpg assets/chest-effect-closed-v24.webp assets/chest-effect-opening-v24.gif assets/chest-effect-open-v24.webp
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply smooth continuous GIF chest opening V24'
          git push
