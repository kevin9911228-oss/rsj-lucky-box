name: Fix and run draw safety upgrade
on:
  push:
    paths:
      - '.github/workflows/fix-run-draw-safety.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/upgrade_draw_safety.py')
          s=p.read_text()
          s=s.replace('。\\n恢复网络后重新打开页面', '。\\\\n恢复网络后重新打开页面')
          p.write_text(s)
          PY
      - name: Patch index
        run: python scripts/upgrade_draw_safety.py
      - name: Validate
        run: |
          node - <<'NODE'
          const s=require('fs').readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          new Function(m[1]);
          for(const x of ['member_session_draw_safe','recoverPendingDraw','rewardTier','showNotice']) if(!s.includes(x)) throw Error(x);
          if(/\balert\s*\(/.test(s)) throw Error('native alert remains');
          console.log('validation ok');
          NODE
      - name: Commit
        run: |
          git config user.name rsj-lucky-bot
          git config user.email actions@users.noreply.github.com
          git add index.html scripts/upgrade_draw_safety.py
          git commit -m 'Add idempotent draw recovery and styled history'
          git push