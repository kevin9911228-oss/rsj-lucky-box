name: Upgrade Royal Chest V2

on:
  push:
    branches: [main]
    paths:
      - '.royal-chest-v2-trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply royal chest redesign
        run: python3 scripts/upgrade_royal_chest.py
      - name: Commit website update
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade royal chest and opening animation' || true
          git push origin main
