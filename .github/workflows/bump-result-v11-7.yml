name: Bump result V11.7 cache
on:
  push:
    paths:
      - '.github/workflows/bump-result-v11-7.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump cache version
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); p.write_text(s.replace('/assets/result-popup-v11-4.css?v=20260810-v11-6','/assets/result-popup-v11-4.css?v=20260810-v11-7'))"
      - name: Commit
        run: |
          rm .github/workflows/bump-result-v11-7.yml
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/bump-result-v11-7.yml
          git commit -m 'Load result popup V11.7 reduced black shadows'
          git push
