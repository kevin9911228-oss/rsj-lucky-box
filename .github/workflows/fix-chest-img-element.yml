name: Fix Chest With Real Image Element

on:
  push:
    branches: [main]
    paths:
      - '.fix-chest-img-element-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chest markup and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="chest"><div class="lid"></div><div class="base"></div><div class="band"></div><div class="lock"></div></div>'
          new = '<div class="chest"><img class="chestMain" src="/assets/royal-chest.webp?v=royal-img-v6" alt="皇家鎏金宝箱" decoding="async"><div class="lid"></div><div class="base"></div><div class="band"></div><div class="lock"></div></div>'
          if 'class="chestMain"' not in s:
              s = s.replace(old, new, 1)
          patch = r'''
/* ROYAL_CHEST_REAL_IMG_V6 */
.chest{
  background:none!important;
  overflow:visible!important;
}
.chestMain{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  display:block!important;
  opacity:1!important;
  visibility:visible!important;
  z-index:4!important;
  pointer-events:none!important;
  filter:drop-shadow(0 16px 18px #000b) drop-shadow(0 0 20px #e5a22955)!important;
  transform:translateZ(0);
}
.chest:before,.chest:after{
  display:none!important;
  content:none!important;
}
.lid,.base{
  display:none!important;
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  left:0!important;
  right:auto!important;
  top:0!important;
  bottom:auto!important;
  border:0!important;
  border-radius:0!important;
  background:url('/assets/royal-chest.webp?v=royal-img-v6') center/contain no-repeat!important;
  box-shadow:none!important;
  pointer-events:none!important;
}
.lid{z-index:6!important;clip-path:polygon(0 0,100% 0,100% 56%,0 56%)!important;transform-origin:50% 55%!important}
.base{z-index:3!important;clip-path:polygon(0 52%,100% 52%,100% 100%,0 100%)!important;transform-origin:50% 54%!important}
.band{z-index:5!important}
.lock{z-index:8!important}
.stage.opening .chestMain,.stage.unlocking .chestMain{
  filter:brightness(1.08) drop-shadow(0 16px 18px #000b) drop-shadow(0 0 28px #ffc84577)!important;
}
.stage.explode .chestMain{
  opacity:0!important;
  visibility:hidden!important;
}
.stage.explode .lid,.stage.explode .base{
  display:block!important;
}
.stage.explode .lid{
  animation:royalRealLidOpen .9s cubic-bezier(.15,.82,.18,1) forwards!important;
  filter:drop-shadow(0 0 20px #ffd85c)!important;
}
.stage.explode .base{
  animation:royalRealBaseSettle .75s cubic-bezier(.18,.8,.22,1) forwards!important;
  filter:drop-shadow(0 14px 14px #000a)!important;
}
@keyframes royalRealLidOpen{
  0%{transform:translateY(0) scale(1)}
  32%{transform:translateY(-7px) scale(1.035);filter:brightness(1.35)}
  62%{transform:translateY(-19px) scaleY(.9) perspective(520px) rotateX(-14deg);filter:brightness(1.55)}
  100%{transform:translateY(-34px) scaleY(.76) perspective(520px) rotateX(-32deg);filter:brightness(1.18)}
}
@keyframes royalRealBaseSettle{
  0%{transform:translateY(0) scale(1)}
  46%{transform:translateY(6px) scale(1.04)}
  100%{transform:translateY(3px) scale(1.015)}
}
@media(prefers-reduced-motion:reduce){
  .stage.explode .lid,.stage.explode .base{animation:none!important}
}
'''
          if '/* ROYAL_CHEST_REAL_IMG_V6 */' not in s:
              s = s.replace('\n</style>', '\n' + patch + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix royal chest with real image element'
          git pull --rebase origin main
          git push
