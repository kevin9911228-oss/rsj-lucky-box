name: Apply chest V8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chest-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chest V8 interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/assets/chest-v8.css?v=20260809-v8">'
          if css not in s:
              if '</head>' not in s: raise SystemExit('missing </head>')
              s=s.replace('</head>', css+'\n</head>', 1)
          s=s.replace('/assets/royal-chest.svg?v=royal-svg-v1','/assets/royal-chest-v8.svg?v=20260809-v8')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate chest V8
        run: |
          grep -q 'chest-v8.css?v=20260809-v8' index.html
          grep -q 'royal-chest-v8.svg?v=20260809-v8' index.html
      - name: Commit live page
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade live prize chest to card-style V8'
          git push
