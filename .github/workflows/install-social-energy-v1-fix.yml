name: Install Social Energy V1 Fix
on:
  push:
    paths:
      - '.github/workflows/install-social-energy-v1-fix.yml'
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject fix stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/assets/social-energy-v1-fix.css?v=20260810-v1">'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>')
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "rsj-lucky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load social energy V1 orb position fix"
          git push
