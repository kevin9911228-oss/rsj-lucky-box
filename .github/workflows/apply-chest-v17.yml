name: Apply chest V17

on:
  push:
    branches: [main]
    paths:
      - 'assets/chest-v17.css'
      - '.github/workflows/apply-chest-v17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire real open artwork into live page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          link='<link rel="stylesheet" href="/assets/chest-v17.css?v=20260809-v17">'
          if link not in s:
              s=s.replace('</head>', link+'\n</head>', 1)

          if 'class="rsjChestOpen17"' not in s:
              pat=r'(<img class="rsjChestClosed"[^>]*>)'
              repl=r'\1<img class="rsjChestOpen17" src="/assets/chest-user-open-v13.webp?v=20260809-v17" alt="" aria-hidden="true" decoding="async">'
              s,n=re.subn(pat,repl,s,count=1)
              if n!=1:
                  raise SystemExit('Could not locate rsjChestClosed image')

          # Let the visual opening finish before the prize-card roulette begins.
          s=s.replace('await wait(1140)}\nasync function settleReward',
                      'await wait(1320)}\nasync function settleReward',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'chest-v17.css?v=20260809-v17' index.html
          grep -q 'class="rsjChestOpen17"' index.html
          grep -q 'chest-user-open-v13.webp?v=20260809-v17' index.html
      - name: Commit live wiring
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Use real open chest artwork for clean V17 opening'
          git push
