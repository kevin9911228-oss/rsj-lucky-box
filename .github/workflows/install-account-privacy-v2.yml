name: Install Account Privacy V2
on:
  push:
    paths:
      - 'assets/account-privacy-v2.js'
      - '.github/workflows/install-account-privacy-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to fixed account privacy script
        run: |
          set -e
          git config user.name 'rsj-privacy-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/assets/account-privacy-v1.js?v=20260812-v1"></script>'
          new='<script src="/assets/account-privacy-v2.js?v=20260812-v2"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
            if git diff --quiet -- index.html; then
              echo 'Account privacy V2 already installed.'
              exit 0
            fi
            git add index.html
            git commit -m 'Use fixed hidden account privacy V2'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to install account privacy V2 after retries.' >&2
          exit 1
