name: Install HD Prize Assets

on:
  push:
    branches: [hd-assets-upload]
    paths:
      - '.hd-upload/complete'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          ref: hd-assets-upload
          fetch-depth: 0

      - name: Rebuild HD asset archive
        shell: bash
        run: |
          set -euo pipefail
          cat .hd-upload/part-* > /tmp/hd-assets.b64
          base64 -d /tmp/hd-assets.b64 > /tmp/hd-assets.zip
          rm -rf /tmp/hd-assets
          mkdir -p /tmp/hd-assets
          unzip -o /tmp/hd-assets.zip -d /tmp/hd-assets
          for f in 20 40 60 100 120 160 200 888; do
            test -s "/tmp/hd-assets/$f.webp"
            file "/tmp/hd-assets/$f.webp"
          done

      - name: Commit HD assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch main
          mkdir -p assets/prizes
          cp /tmp/hd-assets/*.webp assets/prizes/
          printf 'hd-prizes-%s\n' "$(date -u +%Y%m%d%H%M%S)" > .vercel-trigger
          git add assets/prizes .vercel-trigger
          git commit -m 'Replace prize cards with HD artwork'
          git push origin main
