name: Install HD Binary Prize Sprite

on:
  push:
    branches: [hd-assets-upload]
    paths:
      - '.hd-bin/complete'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-assets-upload
          fetch-depth: 0
      - name: Rebuild HD sprite
        shell: bash
        run: |
          set -euo pipefail
          cat .hd-bin/part-* > /tmp/cards-sprite.webp
          test "$(wc -c < /tmp/cards-sprite.webp)" -eq 254556
          file /tmp/cards-sprite.webp | grep -qi 'Web/P'
      - name: Install and patch production frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rsj-lucky-bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch main
          git pull origin main
          mkdir -p assets/prizes
          cp /tmp/cards-sprite.webp assets/prizes/cards-sprite.webp
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          for a in ['20','40','60','100','120','160','200','888']:
              pat=rf'<img class="prizeArt" src="/assets/prizes/{a}\.webp"[^>]*>'
              rep=f'<div class="prizeArt spriteCard s{a}" role="img" aria-label="{a}元奖项"></div>'
              s,n=re.subn(pat,rep,s,count=1)
              if n!=1 and f'spriteCard s{a}' not in s:
                  raise SystemExit(f'failed to patch {a}')
          marker='/* HD_PRIZE_SPRITE_FINAL */'
          css='''\n/* HD_PRIZE_SPRITE_FINAL */\n.spriteCard{background-image:url('/assets/prizes/cards-sprite.webp?v=hd-final-20260808');background-repeat:no-repeat;background-size:400% 200%;background-color:#080a0d}\n.s20{background-position:0% 0%}.s40{background-position:33.333333% 0%}.s60{background-position:66.666667% 0%}.s100{background-position:100% 0%}\n.s120{background-position:0% 100%}.s160{background-position:33.333333% 100%}.s200{background-position:66.666667% 100%}.s888{background-position:100% 100%}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
          printf 'hd-final-%s\n' "$(date -u +%Y%m%d%H%M%S)" > .vercel-trigger
          git add index.html assets/prizes/cards-sprite.webp .vercel-trigger
          git commit -m 'Install final HD prize card artwork'
          git push origin main
