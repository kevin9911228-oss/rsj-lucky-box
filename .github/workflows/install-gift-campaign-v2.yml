name: Install Gift Campaign V2
on:
  push:
    paths:
      - '.github/workflows/install-gift-campaign-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject V2 scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/assets/gift-zone-v2.js?v=20260810-v2"></script>'
          if tag not in s:
              old='<script src="/assets/gift-zone-v1.js?v=20260810-v1"></script>'
              if old in s:
                  s=s.replace(old,old+'\n'+tag)
              else:
                  s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          a=Path('admin.html')
          s=a.read_text()
          atag='<script src="/assets/gift-admin-v2.js?v=20260810-v2"></script>'
          if atag not in s:
              s=s.replace('</body>',atag+'\n</body>')
              a.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name rsj-lucky-bot
          git config user.email actions@users.noreply.github.com
          git add index.html admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load gift campaign V2 with designated voucher winners"
          git push origin HEAD:main