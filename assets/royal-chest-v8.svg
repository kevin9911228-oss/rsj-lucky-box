<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="燃生纪鎏金秘藏宝箱">
<defs>
  <linearGradient id="bgRed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7c0b16"/><stop offset=".28" stop-color="#3b0710"/><stop offset=".65" stop-color="#6d0e16"/><stop offset="1" stop-color="#220208"/></linearGradient>
  <linearGradient id="bgRed2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b21a21"/><stop offset=".18" stop-color="#5c0812"/><stop offset=".52" stop-color="#270209"/><stop offset=".8" stop-color="#8b1018"/><stop offset="1" stop-color="#30030a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8c9"/><stop offset=".08" stop-color="#ffe66f"/><stop offset=".2" stop-color="#d79a1c"/><stop offset=".34" stop-color="#fff1a0"/><stop offset=".47" stop-color="#a95506"/><stop offset=".62" stop-color="#f8c945"/><stop offset=".78" stop-color="#7e3503"/><stop offset=".9" stop-color="#f4bc31"/><stop offset="1" stop-color="#4b1b01"/></linearGradient>
  <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffbdc"/><stop offset=".25" stop-color="#ffe47a"/><stop offset=".55" stop-color="#e19b17"/><stop offset=".78" stop-color="#8d4105"/><stop offset="1" stop-color="#4a1c01"/></linearGradient>
  <radialGradient id="ruby"><stop stop-color="#fff5d7"/><stop offset=".12" stop-color="#ff8b5c"/><stop offset=".33" stop-color="#e11c26"/><stop offset=".62" stop-color="#8b0611"/><stop offset="1" stop-color="#280006"/></radialGradient>
  <radialGradient id="amber"><stop stop-color="#fffde1"/><stop offset=".18" stop-color="#ffe36e"/><stop offset=".48" stop-color="#ffb726"/><stop offset=".78" stop-color="#c46308"/><stop offset="1" stop-color="#5b2502"/></radialGradient>
  <radialGradient id="aura"><stop stop-color="#fff5aa" stop-opacity=".9"/><stop offset=".16" stop-color="#ffd14c" stop-opacity=".52"/><stop offset=".48" stop-color="#f29112" stop-opacity=".16"/><stop offset="1" stop-color="#f29112" stop-opacity="0"/></radialGradient>
  <pattern id="damask" width="84" height="84" patternUnits="userSpaceOnUse"><path d="M42 8C55 22 68 29 76 42c-8 13-21 20-34 34C29 62 16 55 8 42c8-13 21-20 34-34Z" fill="none" stroke="#f7c64f" stroke-opacity=".13" stroke-width="2"/><circle cx="42" cy="42" r="5" fill="#ffd45b" fill-opacity=".08"/></pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/><feOffset dy="18" result="o"/><feComponentTransfer><feFuncA type="linear" slope=".72"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="480" cy="510" rx="365" ry="100" fill="url(#aura)" opacity=".66"/>
<ellipse cx="480" cy="531" rx="318" ry="32" fill="#000" opacity=".42"/>
