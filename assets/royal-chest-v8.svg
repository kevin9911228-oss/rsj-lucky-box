  <g transform="translate(480 117)"><path d="M-63 12l24 22L0-20l39 54 24-22-11 58H-52z" fill="url(#goldBright)" stroke="#fff1a0" stroke-width="4"/><circle cx="-38" cy="34" r="8" fill="url(#ruby)"/><circle cx="0" cy="17" r="9" fill="url(#ruby)"/><circle cx="38" cy="34" r="8" fill="url(#ruby)"/></g>
