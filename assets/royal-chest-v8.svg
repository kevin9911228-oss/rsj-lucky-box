  <rect x="126" y="264" width="708" height="222" rx="36" fill="url(#bgRed2)" stroke="url(#gold)" stroke-width="18"/>
  <rect x="149" y="287" width="662" height="176" rx="22" fill="url(#damask)" opacity=".92"/>
  <!-- lid -->
  <path d="M133 272C145 143 239 76 372 70h216c133 6 227 73 239 202Z" fill="url(#bgRed)" stroke="url(#gold)" stroke-width="18"/>
