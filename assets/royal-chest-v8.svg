    <path d="M666 178c-28-39-82-49-116-15-22 22-5 56 24 52 22-3 28-30 9-41-18-11-42 1-47 22"/>
    <path d="M205 342c31-39 80-39 105-7 20 25 1 55-29 48-21-5-22-32-2-42 19-9 44 5 44 29 0 27-25 48-58 45-28-2-50-18-60-42"/>
    <path d="M755 342c-31-39-80-39-105-7-20 25-1 55 29 48 21-5 22-32 2-42-19-9-44 5-44 29 0 27 25 48 58 45 28-2 50-18 60-42"/>
  </g>
