  <g fill="url(#gold)" stroke="#5d2502" stroke-width="3"><path d="M139 294h78v62h-38v95h-40z"/><path d="M821 294h-78v62h38v95h40z"/><path d="M139 422h78v48h-78z"/><path d="M821 422h-78v48h78z"/></g>
