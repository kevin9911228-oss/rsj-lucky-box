    <path d="M458 75h44v396h-48z"/>
    <path d="M694 98h45l-12 370h-50z"/>
    <path d="M132 259h696v38H132z"/>
    <path d="M144 382h672v34H144z"/>
  </g>
  <g fill="none" stroke="#ffe891" stroke-width="3" opacity=".72"><path d="M239 115h18l15 335h-22z"/><path d="M471 93h18v354h-22z"/><path d="M710 114h17l-10 336h-22z"/></g>
