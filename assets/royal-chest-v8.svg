  <path d="M186 327c95-33 216-29 286-18" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="14" stroke-linecap="round"/>
  <path d="M232 142c100-44 227-35 301-26" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="15" stroke-linecap="round"/>
</g>
<!-- restrained sparkles, kept around chest only -->
<g fill="#fff5b6" filter="url(#glow)"><path d="M142 236l5 11 11 5-11 5-5 11-5-11-11-5 11-5Z"/><path d="M828 235l4 9 9 4-9 4-4 9-4-9-9-4 9-4Z"/><path d="M755 111l4 8 8 4-8 4-4 8-4-8-8-4 8-4Z"/></g>
