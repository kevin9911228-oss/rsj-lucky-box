    <path d="M310 137l19-22 20 22-20 26z"/><path d="M650 137l-19-22-20 22 20 26z"/>
    <rect x="161" y="315" width="28" height="28" rx="7"/><rect x="771" y="315" width="28" height="28" rx="7"/>
    <rect x="161" y="431" width="28" height="28" rx="7"/><rect x="771" y="431" width="28" height="28" rx="7"/>
