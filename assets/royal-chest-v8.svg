    <path d="M0-50c24 0 43 19 43 43 0 25-19 45-43 45S-43 18-43-7c0-24 19-43 43-43Z" fill="url(#ruby)" stroke="#ffe47f" stroke-width="6" filter="url(#glow)"/>
