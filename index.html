<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100805">
<title>陈健幸运抽奖</title>
<style>
:root{--gold:#f4c85a;--gold2:#ffea9a;--red:#9e251b;--ink:#fff4d2;--muted:#c7ad7d;--line:#60401f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0605;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#8f3b1d66,transparent 30%),radial-gradient(circle at 10% 20%,#5c341133,transparent 28%),linear-gradient(180deg,#160c08,#0a0605 55%,#050302)}.app{width:min(100%,760px);margin:auto;padding:18px 12px 90px}.hero{text-align:center;padding:10px 8px 18px}.eyebrow{font-size:10px;letter-spacing:7px;color:#b99350}.hero h1{margin:7px 0 4px;font-size:36px;line-height:1.05;background:linear-gradient(#fff9d8,#ffd66c 55%,#c88718);-webkit-background-clip:text;color:transparent;text-shadow:0 0 26px #ffc44b26}.hero p{margin:0;color:#b89f73;font-size:12px;letter-spacing:2px}.card{border:1px solid #5a3d20;border-radius:22px;background:linear-gradient(180deg,#19100ce8,#0e0908ed);box-shadow:0 20px 50px #0008,inset 0 1px #ffe8a014}.drawBox{position:relative;padding:14px;overflow:hidden}.drawBox:before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,#ffdc6810 0 4deg,transparent 4deg 18deg);animation:spinbg 20s linear infinite}.drawBox>*{position:relative;z-index:1}.titleRow{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.titleRow h2{margin:0;font-size:20px;color:#ffe28b}.titleRow span{font-size:10px;color:#a58e68}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prize{height:112px;border:1px solid #654321;border-radius:16px;background:radial-gradient(circle at 50% 0,#9c3c203a,transparent 48%),linear-gradient(180deg,#1c120e,#100a08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 1px #ffd56c09;transition:.16s}.prize.active{transform:scale(1.04);border-color:#ffe08c;box-shadow:0 0 0 2px #ffea9a66 inset,0 0 28px #ffc64066;background:radial-gradient(circle at 50% 20%,#d1912b73,transparent 52%),linear-gradient(180deg,#31200f,#15100a)}.icon{font-size:30px;line-height:1}.prize b{margin-top:6px;font-size:15px;color:#ffe19a}.prize small{margin-top:3px;font-size:9px;color:#9f8a69}.center{background:radial-gradient(circle at 50% 15%,#edca6a,#b97919 58%,#70420a);border-color:#ffe59c;color:#271503;cursor:pointer;box-shadow:0 0 30px #ffc9403a,inset 0 2px #fff0b4}.center .icon{font-size:25px}.center b{font-size:19px;color:#321a03}.center small{color:#57330e}.center:active{transform:scale(.96)}.center.disabled{opacity:.6;pointer-events:none}.result{margin-top:12px;padding:13px;border:1px solid #604622;border-radius:15px;background:#0e0a08;text-align:center;min-height:72px;display:flex;align-items:center;justify-content:center}.result strong{display:block;font-size:23px;color:#ffe184}.result span{display:block;margin-top:4px;font-size:10px;color:#a99470}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mini{padding:14px}.mini h3{margin:0 0 9px;font-size:15px;color:#f1d18a}.stat{font-size:28px;font-weight:1000;color:#ffd762}.stat small{font-size:11px;color:#a58e68;font-weight:500}.records{margin-top:12px;padding:14px}.records h3{margin:0 0 10px;font-size:16px;color:#f0d396}.record{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #302216;font-size:11px}.record:last-child{border-bottom:0}.record b{color:#ffdb78}.empty{padding:16px 0;text-align:center;color:#806f58;font-size:11px}.foot{text-align:center;margin-top:18px;font-size:9px;color:#695a49;letter-spacing:1px}@keyframes spinbg{to{transform:rotate(360deg)}}@media(max-width:520px){.app{padding-left:8px;padding-right:8px}.hero h1{font-size:31px}.prize{height:100px}.tools{grid-template-columns:1fr 1fr}.prize b{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero"><div class="eyebrow">CHEN JIAN · LUCKY</div><h1>陈健幸运抽奖</h1><p>好运正在发生 · 每一次都有惊喜</p></header>
  <section class="card drawBox">
    <div class="titleRow"><h2>幸运奖池</h2><span>首版演示 · 奖项可后台配置</span></div>
    <div class="grid" id="grid">
      <div class="prize" data-prize="神秘大奖"><div class="icon">👑</div><b>神秘大奖</b><small>惊喜揭晓</small></div>
      <div class="prize" data-prize="一等奖"><div class="icon">🎁</div><b>一等奖</b><small>幸运降临</small></div>
      <div class="prize" data-prize="二等奖"><div class="icon">💎</div><b>二等奖</b><small>好运加倍</small></div>
      <div class="prize" data-prize="三等奖"><div class="icon">🧧</div><b>三等奖</b><small>喜气满满</small></div>
      <button class="prize center" id="drawBtn"><div class="icon">✨</div><b>立即抽奖</b><small>点击开启好运</small></button>
      <div class="prize" data-prize="幸运奖"><div class="icon">🍀</div><b>幸运奖</b><small>幸运常伴</small></div>
      <div class="prize" data-prize="惊喜奖"><div class="icon">🌟</div><b>惊喜奖</b><small>惊喜不断</small></div>
      <div class="prize" data-prize="欢乐奖"><div class="icon">🎉</div><b>欢乐奖</b><small>快乐加倍</small></div>
      <div class="prize" data-prize="纪念奖"><div class="icon">🏅</div><b>纪念奖</b><small>好运留念</small></div>
    </div>
    <div class="result" id="result"><div><strong>准备好了吗？</strong><span>点击“立即抽奖”体验第一版效果</span></div></div>
  </section>
  <div class="tools"><section class="card mini"><h3>今日抽奖</h3><div class="stat" id="drawCount">0 <small>次</small></div></section><section class="card mini"><h3>今日中奖</h3><div class="stat" id="winCount">0 <small>次</small></div></section></div>
  <section class="card records"><h3>最近中奖记录</h3><div id="records" class="empty">暂无记录，等待第一份好运</div></section>
  <div class="foot">© 2026 陈健幸运抽奖 · chenjianCJ.com</div>
</div>
<script>
const cells=[...document.querySelectorAll('.prize[data-prize]')],btn=document.getElementById('drawBtn'),result=document.getElementById('result'),records=document.getElementById('records');let draws=0,wins=0,running=false,history=[];function renderRecords(){records.className='';records.innerHTML=history.length?history.slice(0,5).map((x,i)=>`<div class="record"><span>${new Date(x.t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · 幸运用户${String(i+1).padStart(2,'0')}</span><b>${x.p}</b></div>`).join(''):'<div class="empty">暂无记录，等待第一份好运</div>'}btn.addEventListener('click',async()=>{if(running)return;running=true;btn.classList.add('disabled');draws++;document.getElementById('drawCount').innerHTML=draws+' <small>次</small>';let target=Math.floor(Math.random()*cells.length),steps=28+Math.floor(Math.random()*10),pos=0;for(let i=0;i<steps;i++){cells.forEach(x=>x.classList.remove('active'));cells[pos%cells.length].classList.add('active');pos++;await new Promise(r=>setTimeout(r,55+Math.min(i*4,110)))}cells.forEach(x=>x.classList.remove('active'));cells[target].classList.add('active');wins++;document.getElementById('winCount').innerHTML=wins+' <small>次</small>';let p=cells[target].dataset.prize;result.innerHTML=`<div><strong>🎊 恭喜抽中：${p}</strong><span>正式版可接入账号、次数、奖品库存和后台控制</span></div>`;history.unshift({p,t:Date.now()});renderRecords();btn.classList.remove('disabled');running=false})
</script>
</body>
</html>
